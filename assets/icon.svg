<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>拾贝</title>
  <!-- 海獭双手托着扇贝：拾起碎片，收进口袋 -->
  <rect width="128" height="128" rx="30" fill="#E9F2FE"/>
  <rect x="1.5" y="1.5" width="125" height="125" rx="28.5" stroke="#D2E3FC" stroke-width="3"/>

  <!-- 耳朵 -->
  <circle cx="28" cy="36" r="10" fill="#6B4326"/>
  <circle cx="100" cy="36" r="10" fill="#6B4326"/>

  <!-- 头 -->
  <ellipse cx="64" cy="48" rx="38" ry="34" fill="#8B5E3C"/>

  <!-- 腮红 -->
  <circle cx="34" cy="64" r="7" fill="#E9A0A0" fill-opacity="0.5"/>
  <circle cx="94" cy="64" r="7" fill="#E9A0A0" fill-opacity="0.5"/>

  <!-- 浅色面罩：覆盖下半张脸，海獭的关键特征 -->
  <ellipse cx="64" cy="68" rx="30" ry="16" fill="#FFF7E9"/>

  <!-- 眼睛落在面罩上缘 -->
  <circle cx="48" cy="54" r="7" fill="#3B2617"/>
  <circle cx="50.4" cy="51.4" r="2.4" fill="#FFFFFF"/>
  <circle cx="80" cy="54" r="7" fill="#3B2617"/>
  <circle cx="82.4" cy="51.4" r="2.4" fill="#FFFFFF"/>

  <!-- 鼻子：宽而扁 -->
  <ellipse cx="64" cy="64" rx="10" ry="6.5" fill="#3B2617"/>

  <!-- 胡须 -->
  <path d="M38 66L28 62M38 74L28 74" stroke="#F0DCC0" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M90 66L100 62M90 74L100 74" stroke="#F0DCC0" stroke-width="2.4" stroke-linecap="round"/>

  <!-- 双爪：中间调棕褐，浅底与深底都看得清 -->
  <circle cx="44" cy="100" r="10.5" fill="#C9A87C"/>
  <circle cx="84" cy="100" r="10.5" fill="#C9A87C"/>

  <!-- 扇贝：上缘带波浪，铰合点在底部 -->
  <path d="M46 94q4.5-7 9 0q4.5-7 9 0q4.5-7 9 0q4.5-7 9 0a18 18 0 0 1-36 0Z" fill="#F5A26B"/>
  <path d="M64 111L54 96M64 111L64 92M64 111L74 96" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="2" stroke-linecap="round"/>
</svg>
